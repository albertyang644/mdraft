<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Keyed gradient for the flat-modern look -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7ee6"/>
      <stop offset="1" stop-color="#1b5cb8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="28" y="28" width="456" height="456" rx="84"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>

  <!-- "MD" title -->
  <text x="256" y="235" text-anchor="middle"
        font-family="DejaVu Sans, Noto Sans, sans-serif"
        font-size="200" font-weight="bold" fill="#ffffff">MD</text>

  <!-- Markdown "M↓" accent under the title -->
  <text x="256" y="365" text-anchor="middle"
        font-family="DejaVu Sans, Noto Sans, sans-serif"
        font-size="60" font-weight="bold" fill="#ffffff" fill-opacity="0.85">M↓</text>
</svg>
